[advisories]
ignore = [
  { id = "RUSTSEC-2024-0384", reason = "instant 0.1.13 is still pulled in transitively through reqwest-retry's parking_lot/wasm-timer stack; this ticket does not replace that retry chain." },
  { id = "RUSTSEC-2026-0186", reason = "The Windows release-comparison fixture retains cacache 13.1.0 and its memmap2 0.5.10 dependency to inspect the legacy store. The runtime cache uses SQLite. The fixture does not call advise_range or flush_range." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 is an unmaintained transitive dependency of fontdue in kuva's PNG renderer. The advisory offers no safe upgrade; BioMCP keeps this visible until kuva replaces its font parser." },
  { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 rides in only through calamine 0.36.1 (the workbook reader behind the supplement text search); calamine pins zip ^8.6 and no calamine release builds on zip 9. The advisory affects extraction preserving SUID/SGID/sticky permission bits from archive entries; neither calamine nor BioMCP extracts zip 8 archives to the filesystem - members are read into memory - and BioMCP's own archive handling stays on the fixed zip 9.0.4." },
  { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 rides in only through calamine 0.36.1 (the workbook reader behind the supplement text search); calamine pins zip ^8.6 and no calamine release builds on zip 9. The advisory affects ZipArchive::extract() creating symlinks that escape the destination; neither calamine nor BioMCP extracts zip 8 archives to the filesystem - members are read into memory - and BioMCP's own archive handling stays on the fixed zip 9.0.4." },
  { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 rides in only through calamine 0.36.1 (the workbook reader behind the supplement text search); calamine pins zip ^8.6 and no calamine release builds on zip 9. The advisory affects ZipStreamReader::extract() applying Unix permissions through extracted symlinks; neither calamine nor BioMCP extracts zip 8 archives to the filesystem - members are read into memory - and BioMCP's own archive handling stays on the fixed zip 9.0.4." },
]
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
]

