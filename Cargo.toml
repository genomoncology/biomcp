[package]
name = "biomcp-cli"
# Main carries the next development version between releases (2132):
# 0.9.4-dev until the 0.9.4 release commit drops the suffix. A build
# from main then reports 0.9.4-dev+g<sha>, never the released number.
version = "0.9.4-dev"
edition = "2024"
# The minimum Rust the code needs (ticket 2125): the std file locks
# 2072 introduced are 1.89 or later; release lanes pin 1.93.1.
rust-version = "1.89"
description = "Biomedical CLI and MCP server — genes, variants, trials, articles, drugs, diseases, pathways, proteins, adverse events, PGx"
homepage = "https://biomcp.org"
repository = "https://github.com/genomoncology/biomcp"
documentation = "https://biomcp.org"
license = "MIT"
readme = "README.md"
keywords = ["bioinformatics", "mcp", "genomics", "clinical-trials", "pubmed"]
categories = ["command-line-utilities", "science"]
exclude = [
    ".config/",
    "CLAUDE.md",
    "architecture/",
    "protos/",
    "scripts/regenerate-alphagenome-proto",
    "sdlc/",
    "testdata/",
    "tools/alphagenome-proto-generator/",
    "tools/check-zero-coupling.py",
    "tools/measure-0-9-3-baseline",
    "tools/zero-coupling-historical.json",
    "tests/test_zero_coupling_ratchet.py",
]

[[bin]]
name = "biomcp"
path = "src/main.rs"

[dependencies]

# CLI
clap = { version = "4", features = ["derive"] }
kuva = "0.5.0"

# Async
# test-util stays out of the shipped binary's tokio: only tests pause
# the clock, so it is a dev-dependency below.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "io-util", "net", "process"] }
tokio-stream = { version = "0.1", optional = true }
tokio-util = "0.7"
futures = "0.3"

# HTTP
axum = { version = "0.8.1", default-features = false, features = ["tokio", "http1", "json"] }
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "multipart"] }
reqwest-middleware = { version = "0.4", features = ["json", "multipart"] }
reqwest-retry = "0.7"
http-cache = { version = "0.20", default-features = false }
http-cache-reqwest = { version = "0.15", default-features = false }
http-cache-semantics = "2"
http = "1"
http-body-util = "0.1"

# TLS trust for an operator-supplied CA bundle
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# gRPC (AlphaGenome). The transport default brings a gRPC server this
# client never runs; channel alone gives it Endpoint and Channel.
tonic = { version = "0.14", default-features = false, features = ["codegen", "channel", "tls-ring", "tls-native-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
zstd = { version = "0.13", optional = true }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "unbounded_depth"] }
base64 = "0.22"

# Hashing (download cache keys)
md5 = "0.7"

# Random ids (GenCC generation temp names)
uuid = { version = "1", features = ["v4"] }

# Parsing
bytesize = "1"
humantime = "2"
regex = "1"
csv = "1"
roxmltree = "0.20"
# 2152: the supplement text search reads xlsx and binary xls workbooks;
# calamine is the one maintained Rust reader covering both container types.
calamine = { version = "0.36", default-features = false }
# default-features = false drops the scraper CLI's getopts binary.
scraper = { version = "0.27", default-features = false, features = ["errors"] }
toml = "0.8"

# MCP
rmcp = { version = "1.1.1", features = ["server", "transport-io", "transport-streamable-http-server"] }

# Templates
minijinja = { version = "2", features = ["builtins"] }

# Embedded skills. debug-embed (GitHub #287): debug-profile builds
# embed the same assets as release, so a debug binary can never
# carry a runtime lookup root into the world.
rust-embed = { version = "8", features = ["debug-embed"] }

# Self-update. The zip crate's defaults build bzip2, AES, zopfli and a
# second zstd C library; both call sites read deflate archives only, so
# deflate-flate2 keeps the plain flate2 codec and no other backend.
flate2 = "1"
semver = "1"
sha2 = "0.10"
libc = "0.2"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# XDG paths
dirs = "5"

# Time (metadata footer timestamps)
time = { version = "0.3", features = ["formatting", "local-offset"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"
async-trait = "0.1"

# Command parsing for MCP shell
shlex = "1"
dom_smoothie = "0.18"
htmd = "0.5.4"
unpdf = "0.4.5"

# Unicode normalization (provider display text)
unicode-normalization = "0.1.25"

[features]
default = ["alphagenome", "charts-png"]
alphagenome = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:zstd", "dep:tokio-stream"]
charts-png = ["kuva/png"]

[lints.clippy]
# 2076: clippy replaces the deleted size, line-cap and wait ratchet
# scripts; thresholds and the banned sleep list live in clippy.toml.
too_many_lines = "warn"
disallowed_methods = "warn"

[dev-dependencies]
biomcp-mcp-contract-client = { path = "crates/biomcp-mcp-contract-client" }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
serial_test = "3"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# Dev and test builds keep only line tables, so panic backtraces still name
# file and line while builds compile, link, and fill target/ faster and
# smaller; dependencies carry no debug info. Build with --profile debugging
# for full debug info under a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[target.'cfg(windows)'.dev-dependencies]
# The comparison harness retains the released file-store fixture.
cacache = { version = "13.1.0", default-features = false, features = ["mmap", "tokio-runtime"] }
