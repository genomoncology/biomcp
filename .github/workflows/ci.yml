name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1
  PYTHON_VERSION: 3.12.3
  UV_VERSION: 0.8.0
  RUFF_VERSION: 0.13.2
  CARGO_NEXTEST_VERSION: 0.9.132
  CARGO_DENY_VERSION: 0.19.4
  MUSTMATCH_VERSION: 0.1.0
  PROTOC_VERSION: 28.3
  BUBBLEWRAP_VERSION: 0.9.0-1ubuntu0.1
  APPARMOR_VERSION: 4.0.1really4.0.1-0ubuntu0.24.04.7
  RIPGREP_VERSION: 14.1.0-1

jobs:
  canonical-gates:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.3
      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.8.0
      - name: Install pinned protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install canonical gate tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            "bubblewrap=$BUBBLEWRAP_VERSION" \
            "apparmor=$APPARMOR_VERSION" \
            "apparmor-profiles=$APPARMOR_VERSION" \
            "ripgrep=$RIPGREP_VERSION"
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          tools/run-offline -- true
          cargo install cargo-nextest --version "$CARGO_NEXTEST_VERSION" --locked
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          uv tool install "ruff==$RUFF_VERSION"
          uv tool install "mustmatch==$MUSTMATCH_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tools/bootstrap-lint-tools >> "$GITHUB_PATH"
      - name: Record exact tool versions
        run: |
          rustc --version
          python --version
          uv --version
          ruff --version
          cargo nextest --version
          cargo deny --version
          mustmatch --version
          protoc --version
          shellcheck --version
          actionlint --version
      - name: Canonical lint gate
        run: make lint
      - name: Canonical test gate
        run: make test
      - name: Canonical specification gate
        run: make spec

  full-features:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          components: clippy
      - run: make full-feature-check

  generated-sources:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - run: scripts/regenerate-alphagenome-proto --check

  windows-contracts:
    timeout-minutes: 45
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Compile Windows CSpec and managed-state boundaries
        run: |
          cargo check --locked
          cargo test --locked --test managed_state_permissions

  repository-contracts:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
      - run: cmp --silent install.sh docs/install.sh
      - run: bash scripts/check-version-sync.sh
      - run: bash scripts/check-no-climb-tracked.sh
