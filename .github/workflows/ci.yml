name: CI

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run only the Windows cache-lock regression checks
        type: boolean
        default: false
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1
  PYTHON_VERSION: 3.12.3
  UV_VERSION: 0.8.0
  RUFF_VERSION: 0.13.2
  CARGO_NEXTEST_VERSION: 0.9.146
  CARGO_NEXTEST_SHA256: b64617e8640624e8f9ba99819e37d7971154e97836d7ae4774fed4715501a6aa
  CARGO_DENY_VERSION: 0.19.4
  MUSTMATCH_VERSION: 0.1.0
  PROTOC_VERSION: 28.3

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    # The green-tip route (ticket 2086) asks for the previous
    # tip's ci.yml run through gh api; a job-level permissions
    # block replaces the workflow's, so this restates contents:
    # read for the checkout and adds actions: read for that query.
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Decide whether the push touches only docs
        id: classify
        env:
          PUSH_BASE_REF: origin/main
          PUSH_AFTER: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-classify-push.sh

  # One dev build serves every lane (ticket 2075): this job runs
  # `make prepare-test` once, which builds the nextest archive, the
  # dev binary and the MCP example binary in one cargo invocation,
  # and uploads all three as one artifact. The lanes below download
  # it instead of rebuilding, so a full run costs the build job plus
  # its longest lane.
  build:
    needs: changes
    # Manual dispatch classifies as full CI, so every Rust lane runs.
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          cache: shared
          python: true
          nextest: true
      - name: Build the dev test archive and binaries
        run: make prepare-test
      - name: Fetch the offline lanes' cargo registry
        # The python lane's contract tests resolve and compile the
        # packaged crate with default features inside the offline
        # namespace; prepare-test fetches only the no-default routine
        # graph, so the default-feature half of the lockfile lands here,
        # where the lanes' shared cache save persists it.
        run: cargo fetch --locked
      - name: Upload the dev build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dev-build
          if-no-files-found: error
          retention-days: 1
          path: |
            .cache/routine-tests.tar.zst
            target/debug/biomcp
            target/debug/examples/rmcp_streamable_http_contract

  # The four routine lanes (ticket 2075): each needs only the build
  # job's artifact, so none waits on another lane and they run in
  # parallel. Each runs its whole gate through a Makefile target, so
  # `make test` stays the developer's one command.

  lint:
    needs: [changes, build]
    # Manual dispatch classifies as full CI, so every Rust lane runs.
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Download the dev build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dev-build
      - name: Set up the lane
        # The quality ratchet's spec lint shells out to mustmatch.
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          components: rustfmt, clippy
          cache: shared-restore
          python: true
          mustmatch: true
          lint-tools: true
      - name: Canonical lint gate
        run: make lint

  rust-tests:
    needs: [changes, build]
    # Manual dispatch classifies as full CI, so every Rust lane runs.
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Download the dev build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dev-build
      - name: Restore the dev binaries' exec bits
        # upload-artifact does not preserve file modes; the tests drive
        # these binaries through CARGO_BIN_EXE_biomcp's original path.
        run: >-
          chmod +x target/debug/biomcp
          target/debug/examples/rmcp_streamable_http_contract
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          offline: true
          nextest: true
      - name: Canonical Rust test gate
        run: make test-rust

  python-lane:
    needs: [changes, build]
    # Manual dispatch classifies as full CI, so every Rust lane runs.
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      # Full history: the release version contracts this lane runs
      # read the tag history (the canonical-gates job carried this
      # checkout before ticket 2075 split it).
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Download the dev build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dev-build
      - name: Restore the dev binaries' exec bits
        run: >-
          chmod +x target/debug/biomcp
          target/debug/examples/rmcp_streamable_http_contract
      - name: Set up the lane
        # The Python contract suite drives the cargo toolchain (the
        # source-package boundary tests run cargo package --offline)
        # and the standalone mustmatch binary.
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          cache: shared-restore
          python: true
          offline: true
          mustmatch: true
      - name: Fetch the cargo registry for the offline contract tests
        # The contract tests compile the packaged crate and the
        # no-default test lane inside the offline sandbox, where no
        # download can happen. This fetches the registry the way
        # prepare-test did when the gates shared one job; the restored
        # cache only shortens it.
        run: cargo fetch --locked
      - name: Canonical Python contract gate
        run: make test-python

  spec-lane:
    needs: [changes, build]
    # Manual dispatch classifies as full CI, so every Rust lane runs.
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      # Full history: spec/surface/mcp.md's release-prep block runs
      # scripts/check-version-sync.sh, which reads the reachable tags.
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Download the dev build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dev-build
      - name: Restore the dev binaries' exec bits
        run: >-
          chmod +x target/debug/biomcp
          target/debug/examples/rmcp_streamable_http_contract
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          cache: shared-restore
          python: true
          offline: true
          mustmatch: true
      - name: Canonical specification gate
        run: make spec

  # Manual runs exercise the stress, release-panic, full-feature and
  # Windows checks on the selected revision alongside the routine lanes.
  # The stress lane reuses the build job's archive and pins the known
  # load-flaky set to two CPUs; one CPU deadlocks the handshake child.
  stress-lane:
    needs: [changes, build]
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Download the dev build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dev-build
      - name: Restore the dev binaries' exec bits
        run: >-
          chmod +x target/debug/biomcp
          target/debug/examples/rmcp_streamable_http_contract
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          python: true
          offline: true
          nextest: true
      - name: Stress lane
        run: make stress

  release-panic:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    # The release-mode panic-recovery contract (ticket 1257): the
    # same build and nextest invocation `make verify` runs, without
    # network or credentials — the test drives an in-process stdio
    # session with an injected tool panic.
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          cache: job
          nextest: true
      - name: Release-mode panic recovery contract
        run: |
          cargo build --release --locked
          cargo nextest run --release --test rmcp_client_contract rmcp_stdio_recovers_from_tool_panic

  full-features:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          components: clippy
          cache: job
      - run: make full-feature-check FULL_FEATURE_PROFILE=release

  generated-sources:
    needs: changes
    # Manual dispatch classifies as full CI, so every Rust lane runs.
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && !inputs.windows_only && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the lane
        uses: ./.github/actions/lane-setup
        with:
          rust: true
          cache: job
      - run: scripts/regenerate-alphagenome-proto --check

  windows-contracts:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 45
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Cache the Rust build
        # The v2 tag dereferenced to its commit 2026-09-29; runs
        # after the toolchain install so the key uses the pinned
        # rustc, and caches the workspace crates so the biomcp
        # crate itself is not rebuilt from scratch every run.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-workspace-crates: true
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.3
      - name: Check cache-lock contention and article-search deadlines
        shell: bash
        run: |
          cargo test --locked --no-default-features --test windows_lock_contract
          cargo test --locked --no-default-features --lib body_limit_epoch_lock_contention_obeys_variant_article_deadline
          cargo test --locked --no-default-features --lib construction_under_a_held_epoch_lock_honors_the_deadline
      - name: Compile Windows CSpec and managed-state boundaries
        if: ${{ !inputs.windows_only }}
        run: |
          cargo check --locked
          cargo test --locked --test managed_state_permissions
          cargo test --locked --test windows_stdio_contract
          cargo test --locked --lib cache::private
      # Ticket 2024 reopening: tools/with-build-identity handed off
      # with os.execvpe, which on Windows exits 0 at once while the
      # child keeps running, so a release build step passed with no
      # binary. This step runs the wrapper on Windows and fails
      # unless it waits for the child and passes the exit code
      # through.
      - name: Check with-build-identity passes exit codes through
        if: ${{ !inputs.windows_only }}
        shell: bash
        run: |
          python tools/with-build-identity cargo --version
          status=0
          python tools/with-build-identity cargo build --locked --unknown-2024-flag >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "with-build-identity returned 0 while the cargo command failed" >&2
            exit 1
          fi
          status=0
          python tools/with-build-identity python -c 'raise SystemExit(42)' || status=$?
          if [ "$status" -ne 42 ]; then
            echo "with-build-identity passed exit $status instead of the child's 42" >&2
            exit 1
          fi

  repository-contracts:
    if: ${{ !inputs.windows_only }}
    # Always runs, including docs-only pushes: these are the
    # tests that read the files a docs-only push changes
    # (2026-09-29 review). The needs_binary marker excludes
    # only the tests that drive a built binary; the routine
    # lanes run those.
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.3
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.8.0
      - name: Sync the Python contract environment
        run: uv sync --extra dev --no-install-project
      - name: Python contract tests (docs and records)
        run: uv run --no-sync pytest tests/ -q -m "not needs_binary"
      - name: Documentation build
        run: uv run --no-sync env NO_MKDOCS_2_WARNING=1 mkdocs build --strict
      - run: cmp --silent install.sh docs/install.sh
      - run: bash scripts/check-version-sync.sh
      - run: bash scripts/check-no-climb-tracked.sh

  # The release checks on each manual run: a
  # branch that changes shipped behavior must carry its changelog
  # bullet before review, and the release's green-CI query must
  # parse on the real gh the runners ship. Both failures used to
  # surface only at a tag, 13 seconds into the release workflow's
  # version check, after a 26-minute CI run. This lane is git,
  # python3, gh and jq only — no Rust build — so it runs on each
  # manual run alongside the heavy release-shaped jobs.
  release-checks:
    if: ${{ !inputs.windows_only }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # gh run list reads the workflow-run history; a job-level
      # permissions block replaces the workflow's, so this restates
      # contents: read and adds the query's actions: read.
      actions: read
    steps:
      # Full history: the changelog check walks the landings since
      # the last tag and diffs against the merge-base with
      # origin/main.
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Require the changelog to cover the branch
        # Reusable release qualification already passed the release-form gate.
        # An untagged stable candidate has a dated, closed changelog section.
        if: inputs.revision == ''
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/check-changelog-coverage.py --branch
      - name: Require the release's green-CI query to run
        # The release runs this exact gh command against the tagged
        # commit and refuses a zero count. A branch has no finished
        # run of its own to ask about, so this step asks the
        # merge-base with origin/main — a trunk commit — and checks
        # the query runs, not its answer: it fails only when gh or jq
        # errors (a flag only a stub accepted, as at the 0.9.2 tag),
        # never on the count itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merge_base="$(git merge-base origin/main "$GITHUB_SHA")"
          green="$(gh run list --workflow ci.yml --commit "$merge_base" \
            --branch main --event push \
            --limit 100 \
            --json conclusion,event,headBranch \
            | jq '[.[] | select(.event == "push" and .headBranch == "main" and .conclusion == "success")] | length')"
          case "$green" in
            '' | *[!0-9]*)
              echo "the release's green-CI query failed against ${merge_base}: gh or jq errored" >&2
              exit 1
              ;;
          esac
          echo "the green-CI query runs on the real gh (${merge_base}: ${green} successful main run(s))"
