name: CI

on:
  pull_request:
  push:
    # Ticket branches run CI too (2026-09-29 direction): a branch's
    # green CI run is the merge condition, which closes the
    # gate-passed-CI-failed gap and lets branches run in parallel.
    branches: [main, "tickets/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.93.1
  PYTHON_VERSION: 3.12.3
  UV_VERSION: 0.8.0
  RUFF_VERSION: 0.13.2
  CARGO_NEXTEST_VERSION: 0.9.132
  CARGO_DENY_VERSION: 0.19.4
  MUSTMATCH_VERSION: 0.1.0
  PROTOC_VERSION: 28.3
  NODE_VERSION: 22.22.3

jobs:
  canonical-gates:
    timeout-minutes: 45
    # Docs-only commits (message starts with 'docs:') skip the Rust jobs
    if: >-
      github.event_name == 'pull_request' || !github.event.head_commit || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.3
      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.8.0
      - name: Install pinned Node
        uses: actions/setup-node@1e60f620b9541d33f31e4d850c561a0a7a76a4f4 # v4.0.3
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked website dependencies
        run: make prepare-website
      - name: Install pinned protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install canonical gate tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            apparmor \
            apparmor-profiles \
            ripgrep
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          tools/run-offline -- true
          curl -LsSf https://get.nexte.st/"$CARGO_NEXTEST_VERSION"/linux | tar zxf - -C "$HOME/.cargo/bin"
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          uv tool install "ruff==$RUFF_VERSION"
          uv tool install "mustmatch==$MUSTMATCH_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tools/bootstrap-lint-tools >> "$GITHUB_PATH"
      - name: Record exact tool versions
        run: |
          rustc --version
          python --version
          uv --version
          ruff --version
          cargo nextest --version
          cargo deny --version
          mustmatch --version
          protoc --version
          shellcheck --version
          actionlint --version
          bwrap --version
          apparmor_parser --version
          rg --version
      - name: Canonical lint gate
        run: make lint
      - name: Canonical test gate
        run: make test
      - name: Canonical specification gate
        run: make spec

  # The stress lane cannot rot: it runs on every push and pull
  # request like the other gates. It reuses the known load-flaky set
  # pinned to a two-CPU set (one-CPU pinning deadlocks the pipe
  # handshake child; see
  # sdlc/issues/2026-09-25-single-cpu-affinity-deadlocks-the-handshake-child.md).
  stress-lane:
    timeout-minutes: 40
    # Docs-only commits (message starts with 'docs:') skip the Rust jobs
    if: >-
      github.event_name == 'pull_request' || !github.event.head_commit || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.12.3
      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.8.0
      - name: Install the offline sandbox and nextest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            apparmor \
            apparmor-profiles \
            ripgrep
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          tools/run-offline -- true
          curl -LsSf https://get.nexte.st/"$CARGO_NEXTEST_VERSION"/linux | tar zxf - -C "$HOME/.cargo/bin"
          tools/bootstrap-lint-tools >> "$GITHUB_PATH"
      - name: Stress lane
        run: make stress

  release-panic:
    # The release-mode panic-recovery contract (ticket 1257): the
    # same build and nextest invocation `make verify` runs, on the
    # canonical lane, without network or credentials — the test
    # drives an in-process stdio session with an injected tool
    # panic.
    timeout-minutes: 30
    # Docs-only commits (message starts with 'docs:') skip the Rust jobs
    if: >-
      github.event_name == 'pull_request' || !github.event.head_commit || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Install pinned nextest
        run: curl -LsSf https://get.nexte.st/"$CARGO_NEXTEST_VERSION"/linux | tar zxf - -C "$HOME/.cargo/bin"
      - name: Release-mode panic recovery contract
        run: |
          cargo build --release --locked
          cargo nextest run --release --test rmcp_client_contract rmcp_stdio_recovers_from_tool_panic

  full-features:
    timeout-minutes: 45
    # Docs-only commits (message starts with 'docs:') skip the Rust jobs
    if: >-
      github.event_name == 'pull_request' || !github.event.head_commit || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          components: clippy
      - run: make full-feature-check

  generated-sources:
    timeout-minutes: 45
    # Docs-only commits (message starts with 'docs:') skip the Rust jobs
    if: >-
      github.event_name == 'pull_request' || !github.event.head_commit || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - run: scripts/regenerate-alphagenome-proto --check

  windows-contracts:
    timeout-minutes: 45
    # Docs-only commits (message starts with 'docs:') skip the Rust jobs
    if: >-
      github.event_name == 'pull_request' || !github.event.head_commit || !startsWith(github.event.head_commit.message, 'docs:')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Compile Windows CSpec and managed-state boundaries
        run: |
          cargo check --locked
          cargo test --locked --test managed_state_permissions
          cargo test --locked --test windows_stdio_contract
          cargo test --locked --lib cache::private

  repository-contracts:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
      - run: cmp --silent install.sh docs/install.sh
      - run: bash scripts/check-version-sync.sh
      - run: bash scripts/check-no-climb-tracked.sh
