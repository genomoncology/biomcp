name: Publish documentation

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

concurrency:
  group: publish-biomcp-docs
  cancel-in-progress: false

env:
  PYTHON_VERSION: 3.12.3
  UV_VERSION: 0.8.0
jobs:
  publish-docs:
    # Ticket 2049: the Pages publication serves the production site and
    # needs this repository's gh-pages history; the scratch repo has none.
    if: >-
      github.repository == 'genomoncology/biomcp' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    env:
      SOURCE_SHA: ${{ inputs.revision || github.sha }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the exact revision and publication history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.revision || github.sha }}
          fetch-depth: 0
      - name: Fetch the existing Pages history
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the locked Python environment
        run: uv sync --extra dev --no-install-project --locked
      - name: Build documentation strictly
        env:
          BIOMCP_DOCS_REVISION: ${{ inputs.revision || github.sha }}
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict
      - name: Admit only the selected revision without replacing newer documentation
        id: admission
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_SHA"
          fi
          published="$(git show refs/remotes/origin/gh-pages:__biomcp_revision__/latest.txt)"
          [[ "$published" =~ ^[0-9a-f]{40}$ ]]
          if git merge-base --is-ancestor "$published" "$SOURCE_SHA"; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$SOURCE_SHA" "$published"; then
            echo 'A newer documentation revision is already published; retain it.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Published documentation diverges from the selected revision; refusing overwrite.' >&2
            exit 1
          fi
      - name: Publish the validated site to the Pages branch
        if: steps.admission.outputs.deploy == 'true'
        env:
          BIOMCP_DOCS_REVISION: ${{ inputs.revision || github.sha }}
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs gh-deploy --strict --force
      - name: Request a Pages build from the configured branch
        if: steps.admission.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Verify the exact revision and static documentation are live
        if: steps.admission.outputs.deploy == 'true'
        run: |
          uv run --no-sync python scripts/verify-docs-publication.py \
            --revision "$SOURCE_SHA" \
            --site-dir site \
            --timeout-seconds 600
