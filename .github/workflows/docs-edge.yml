name: Deploy documentation edge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: 3.12.3
  UV_VERSION: 0.8.0
  WRANGLER_VERSION: 4.32.0

jobs:
  deploy-docs-edge:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install the locked Python environment and pinned Wrangler
        run: |
          uv sync --extra dev --no-install-project --locked
          npm install --global "wrangler@$WRANGLER_VERSION"
      - name: Build documentation strictly
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run --no-sync mkdocs build --strict
      - name: Deploy the validated site and edge worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy
