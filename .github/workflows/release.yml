# Step hashes: every step of pypi-build, wheel-smoke, docs-live,
# version-check and release-gate's run steps is pinned by SHA-256 in
# tests/test_release_workflow_provenance.py (PINNED_STEPS, ticket
# 1258). Any edit to those steps — run text, if:, shell:, with:,
# continue-on-error, env: — must update the hash there in the same
# commit; the test failure names the step and the new hash.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to upload assets to (e.g. v0.9.0)
        required: false
        type: string
      candidate_sha:
        description: Full untagged candidate SHA; dispatch the workflow from this exact revision
        required: false
        type: string
      rehearsal_version:
        description: Stable intended version for a full nonpublishing rehearsal (e.g. 0.9.3)
        required: false
        type: string
      container_only:
        description: Build and push only the container image for an already-published release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.candidate_sha || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: 0.8.0
  TAG: ${{ inputs.rehearsal_version && format('v{0}', inputs.rehearsal_version) || inputs.tag || github.ref_name }}

jobs:
  version-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha || inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Require the tag and committed versions to agree
        id: identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REHEARSAL_VERSION: ${{ inputs.rehearsal_version }}
          INPUT_TAG: ${{ inputs.tag }}
          CONTAINER_ONLY: ${{ inputs.container_only }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi
          if [ -n "$CANDIDATE_SHA$REHEARSAL_VERSION" ]; then
            args=(--candidate-sha "$CANDIDATE_SHA" --workflow-sha "$WORKFLOW_SHA" --rehearsal-version "$REHEARSAL_VERSION")
            if [ -n "$INPUT_TAG" ]; then args+=(--tag "$INPUT_TAG"); fi
            if [ "$CONTAINER_ONLY" = true ]; then args+=(--container-only); fi
            python3 scripts/check-release-versions.py "${args[@]}" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/check-release-versions.py --tag "$TAG" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Require the changelog to cover merged tickets
        run: python3 scripts/check-changelog-coverage.py --tag "$TAG" --revision HEAD


  # Ticket 2125: the release-gate marker set — the packaged-crate
  # cold compile behind `-m release_gate` and any later check that
  # joins it — runs before any archive is built. 2071 moved the cold
  # compile behind a marker only `make release-gate` ran, so nothing
  # in CI or this workflow compiled the packaged crate; `build` and
  # `pypi-build` wait on this job, so no tarball, wheel or zip is
  # built before the marker set passes.
  qualification:
    needs: [version-check]
    if: inputs.container_only != true
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      revision: ${{ needs.version-check.outputs.source_sha }}

  release-gate:
    needs: [version-check, qualification]
    if: github.event_name == 'push' || inputs.candidate_sha != ''
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version-check.outputs.source_sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}

      # The marker set compiles the packaged crate offline; the
      # registry has to be fetched first, the same fetch the CI
      # python lane runs for its contract tests.
      - name: Fetch the cargo registry for the offline marker set
        run: cargo fetch --locked

      - name: Run the release-gate marker set
        run: make release-gate-markers

  create-draft:
    needs: [version-check, qualification]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
    steps:
      # Ticket 2064: v0.9.2 and v0.9.1 published with no release
      # notes. The draft carries the tag's changelog section from the
      # moment it exists, before publish-release makes it public.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version-check.outputs.source_sha }}

      - name: Render the release notes from the changelog
        run: |
          python3 release/release_notes.py --changelog CHANGELOG.md \
            --version "${TAG#v}" --output "$RUNNER_TEMP/release-notes.md"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  build:
    needs: [version-check, release-gate]
    if: github.event_name == 'push' || inputs.candidate_sha != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: biomcp-linux-x86_64.tar.gz
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: biomcp-linux-arm64.tar.gz
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: biomcp-darwin-arm64.tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: biomcp-darwin-x86_64.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: biomcp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version-check.outputs.source_sha }}

      # Ticket 2024: the build steps run tools/with-build-identity so
      # the shipped binaries report their commit instead of
      # "git unknown, build unknown"; the non-Linux legs need the
      # interpreter that script runs on.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: runner.os != 'Linux'
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        if: runner.os != 'Linux'
        continue-on-error: true
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python tools/with-build-identity cargo build --release --locked --target ${{ matrix.target }}

      # Linux tarballs build inside the same manylinux_2_28 container
      # as the wheels, so both artifact families carry one documented
      # glibc floor. The floor scan runs over the pre-tar binary: the
      # same bytes the archive ships. rustup is pinned by version and
      # checksum; nothing pipes a remote script into a shell. The
      # container has no git checkout of its own, so the host resolves
      # the build identity first and the container build inherits it
      # through --env-file.
      - name: Build and package inside the manylinux 2_28 container
        if: runner.os == 'Linux'
        run: |
          tools/with-build-identity env | grep '^BIOMCP_BUILD_' > "$RUNNER_TEMP/biomcp-build-identity.env"
          docker run --rm -v "$PWD:/io" -w /io \
            --env-file "$RUNNER_TEMP/biomcp-build-identity.env" \
            "${{ matrix.container }}" bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init.sha256
            sha256sum -c rustup-init.sha256
            chmod +x rustup-init
            ./rustup-init -y --default-toolchain 1.93.1 --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked --target ${{ matrix.target }}
            /opt/python/cp312-cp312/bin/python scripts/check-wheel-glibc-floor.py --elf target/${{ matrix.target }}/release/biomcp 2.28
            cd target/${{ matrix.target }}/release
            tar czf ../../../${{ matrix.artifact }} biomcp
            cd ../../..
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          '

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} biomcp
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }} biomcp.exe
          cd ../../..
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
        shell: bash

      - name: Retain archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish-assets:
    needs: [build, create-draft]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  pypi-build:
    needs: [version-check, release-gate]
    if: github.event_name == 'push' || inputs.candidate_sha != ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version-check.outputs.source_sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: runner.os != 'Linux'
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        if: runner.os != 'Linux'
        continue-on-error: true
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned maturin
        if: runner.os != 'Linux'
        run: python -m pip install maturin==1.9.6

      - name: Build wheels
        if: runner.os != 'Linux'
        shell: bash
        run: python tools/with-build-identity maturin build --release --locked --target ${{ matrix.target }}

      # Linux wheels build inside the manylinux_2_28 container so the
      # glibc 2.28 floor is true by construction, not merely tagged;
      # the platform tag is pinned with maturin and the scan step
      # enforces the floor against the artifact that ships. rustup is
      # pinned by version and checksum; nothing pipes a remote script
      # into a shell. The container has no git checkout of its own, so
      # the host resolves the build identity first and the container
      # build inherits it through --env-file.
      - name: Build wheels inside the manylinux 2_28 container
        if: runner.os == 'Linux'
        run: |
          tools/with-build-identity env | grep '^BIOMCP_BUILD_' > "$RUNNER_TEMP/biomcp-build-identity.env"
          docker run --rm -v "$PWD:/io" -w /io \
            --env-file "$RUNNER_TEMP/biomcp-build-identity.env" \
            "${{ matrix.container }}" bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init.sha256
            sha256sum -c rustup-init.sha256
            chmod +x rustup-init
            ./rustup-init -y --default-toolchain 1.93.1 --profile minimal
            . "$HOME/.cargo/env"
            /opt/python/cp312-cp312/bin/python -m pip install maturin==1.9.6
            /opt/python/cp312-cp312/bin/python -m maturin build --release --locked --target ${{ matrix.target }} --compatibility manylinux_2_28 -o target/wheels
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-gnu) tag=manylinux_2_28_x86_64 ;;
              aarch64-unknown-linux-gnu) tag=manylinux_2_28_aarch64 ;;
              *) echo "unexpected Linux target: ${{ matrix.target }}" >&2; exit 1 ;;
            esac
            for wheel in target/wheels/*.whl; do
              case "$wheel" in
                *"$tag".whl) ;;
                *) echo "wheel must end in $tag.whl: $wheel" >&2; exit 1 ;;
              esac
            done
            /opt/python/cp312-cp312/bin/python scripts/check-wheel-glibc-floor.py target/wheels/*.whl 2.28
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  wheel-smoke:
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
    needs: [pypi-build]
    if: github.event_name == 'push' || inputs.candidate_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: wheel-x86_64-unknown-linux-gnu
            executable: bin/biomcp
            python: bin/python
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            artifact: wheel-aarch64-unknown-linux-gnu
            executable: bin/biomcp
            python: bin/python
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            artifact: wheel-aarch64-apple-darwin
            executable: bin/biomcp
            python: bin/python
          # 2026-10-01 rehearsal (run 36885506628): GitHub moved the
          # macOS moving label to arm64 (image macos-26-arm64), so
          # pip refuses this x86_64 wheel on that host. The build
          # legs cross-compile with an explicit --target and pin the
          # arm64 image (macos-15, ticket 2024's reopening); the
          # smoke needs a matching host, so it pins the Intel image.
          - os: macos-15-intel
            artifact: wheel-x86_64-apple-darwin
            executable: bin/biomcp
            python: bin/python
          - os: windows-2022
            artifact: wheel-x86_64-pc-windows-msvc
            executable: Scripts/biomcp.exe
            python: Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/wheel

      - name: Install the wheel into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/${{ matrix.python }}" -m pip install "$RUNNER_TEMP"/wheel/*.whl
          expected="${TAG#v}"
          printed="$("$RUNNER_TEMP/wheel-venv/${{ matrix.executable }}" --version)"
          printf '%s\n' "$printed"
          if [ "$(printf '%s' "$printed" | tr -d '\r\n')" != "biomcp $expected" ]; then
            echo "wheel --version must print exactly 'biomcp $expected', got: $printed" >&2; exit 1
          fi

      # Prove the glibc floor at runtime: install and run the wheel
      # inside the same manylinux_2_28 environment users on RHEL 8 or
      # Debian 10 have.
      - name: Run the wheel inside the manylinux 2_28 container
        if: runner.os == 'Linux'
        run: |
          # The tag rides in with -e (ticket 2046): docker passes no
          # job environment into the container, and the script reads
          # ${TAG#v} under `set -u`. Only double quotes live inside
          # the single-quoted script, so nothing closes it early.
          docker run --rm -v "$RUNNER_TEMP/wheel:/wheel:ro" -e TAG "${{ matrix.container }}" bash -euo pipefail -c '
            /opt/python/cp312-cp312/bin/python -m pip install --no-cache-dir /wheel/*.whl
            printed="$(/opt/python/cp312-cp312/bin/biomcp --version)"
            printf "%s\n" "$printed"
            expected="${TAG#v}"
            actual="$(printf "%s" "$printed" | tr -d "\015\012")"
            if [ "$actual" != "biomcp $expected" ]; then
              echo "wheel --version must print exactly biomcp $expected, got: $printed" >&2; exit 1
            fi
            stats="$(/opt/python/cp312-cp312/bin/biomcp cache stats --json)"
            case "$stats" in
              "{"*) ;;
              *) echo "cache stats must print a JSON object, got: $stats" >&2; exit 1 ;;
            esac
          '

      - name: Smoke the installed wheel on every shipped platform
        shell: bash
        run: |
          BIOMCP="$RUNNER_TEMP/wheel-venv/${{ matrix.executable }}"

          require_exit() {
            expected="$1"; shift
            status=0
            output="$("$BIOMCP" "$@" 2>&1)" || status=$?
            printf '%s\n' "$output" | head -n 20
            if [ "$status" -eq 101 ] || [ "$status" -ge 128 ]; then
              echo "panic or crash (exit $status) from: biomcp $*" >&2
              return 1
            fi
            if printf '%s\n' "$output" | grep -q "has overflowed its stack"; then
              echo "stack overflow from: biomcp $*" >&2
              return 1
            fi
            if [ "$status" -ne "$expected" ]; then
              echo "expected exit $expected, got $status from: biomcp $*" >&2
              return 1
            fi
          }

          require_json() {
            status=0
            output="$("$BIOMCP" "$@" 2>/dev/null)" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "json mode must exit 0 from: biomcp $* (exit $status)" >&2
              return 1
            fi
            case "$output" in
              "{"*) ;;
              *) echo "json mode must print an object from: biomcp $*" >&2; return 1 ;;
            esac
            if printf '%s\n' "$output" | grep -q "skill asset"; then
              echo "skill asset error from: biomcp $*" >&2
              return 1
            fi
          }

          require_exit 0 search trial --condition diabetes --limit 1
          require_exit 0 search trial --criteria "anti-PD-1 therapy" --limit 3
          # The DDInter bundle is a local dataset by design: a query
          # on a cold cache tells the user to sync (2026-10-01
          # rehearsal: without this line every wheel-smoke leg failed
          # and the release would have stopped before PyPI — the
          # release workflow had never run this step before).
          require_exit 0 ddinter sync
          require_exit 0 drug interactions apixaban
          require_exit 0 drug trials imatinib

          status=0
          output="$("$BIOMCP" drug adverse-events qwertyzzznonexistent999 2>&1)" || status=$?
          printf '%s\n' "$output" | head -n 20
          [ "$status" -eq 0 ]
          printf '%s\n' "$output" | grep -q "Drug not found in FAERS"

          require_json get drug --region us aspirin regulatory -j
          require_json search trial --condition diabetes --limit 1 -j

          # GitHub #287: the 0.9.0 debug-profile wheel embedded no
          # assets, so skill, chart, and --json ladders failed on
          # every PyPI install. Exercise those paths positively:
          # each must succeed AND name real content, not an empty
          # or missing-asset answer.
          status=0
          output="$("$BIOMCP" skill list 2>&1)" || status=$?
          printf '%s\n' "$output" | head -n 20
          if [ "$status" -ne 0 ] || printf '%s\n' "$output" | grep -q "No skills found"; then
            echo "skill list must name skills (exit $status): #287 regression" >&2
            exit 1
          fi
          # Ticket 1266: exit codes alone let the 0.9.0 debug-wheel
          # failure through (errors exited 0), so assert known
          # content from the embedded assets too — no network.
          status=0
          output="$("$BIOMCP" skill article-follow-up 2>&1)" || status=$?
          printf '%s\n' "$output" | head -n 20
          if [ "$status" -ne 0 ] || ! printf '%s\n' "$output" | grep -q "Article follow-up via citations and recommendations"; then
            echo "skill article-follow-up must show its content (exit $status): #287 regression" >&2
            exit 1
          fi
          status=0
          output="$("$BIOMCP" chart bar 2>&1)" || status=$?
          printf '%s\n' "$output" | head -n 20
          if [ "$status" -ne 0 ] || ! printf '%s\n' "$output" | grep -q "Bar Chart"; then
            echo "chart bar must show the Bar Chart heading (exit $status): #287 regression" >&2
            exit 1
          fi
          require_json --json get article 32794606

  docs-publish:
    needs: [version-check, qualification]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pages: write
    uses: ./.github/workflows/docs-edge.yml
    with:
      revision: ${{ needs.version-check.outputs.source_sha }}

  docs-live:
    needs: [version-check, qualification, docs-publish]
    if: >-
      !cancelled() && !inputs.candidate_sha && needs.version-check.result == 'success' &&
      (needs.qualification.result == 'success' ||
      (inputs.container_only == true && needs.qualification.result == 'skipped')) &&
      (needs.docs-publish.result == 'success' || needs.docs-publish.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
      LIVE_REVISION_URL: https://biomcp.org/__biomcp_revision__/latest.txt
      RETRY_WINDOW_SECONDS: "600"
      RETRY_INTERVAL_SECONDS: "30"
    steps:
      - name: Check out the gate helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version-check.outputs.source_sha }}

      - name: Resolve the tag commit
        env:
          QUALIFIED_SHA: ${{ needs.version-check.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_SHA=""
          for attempt in 1 2 3 4 5; do
            TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)" && break
            sleep $(( attempt * 2 ))
          done
          test -n "$TAG_SHA"
          test "$TAG_SHA" = "$QUALIFIED_SHA"
          echo "TAG_SHA=${TAG_SHA}" >> "$GITHUB_ENV"
          echo "release tag ${TAG} resolves to ${TAG_SHA}"

      - name: Require the live documentation revision to equal or descend from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + RETRY_WINDOW_SECONDS ))
          attempt=0
          while true; do
            attempt=$(( attempt + 1 ))
            live_revision="$(
              curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --header 'User-Agent: BioMCP-docs-live-gate/1' \
                "${LIVE_REVISION_URL}?biomcp_verify=$(date +%s%N)-${attempt}"
            )" || live_revision=""
            if [[ ! "$live_revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "attempt ${attempt}: ${LIVE_REVISION_URL} did not serve a 40-character revision"
            elif python3 scripts/check-docs-live-revision.py \
              --repository "$GITHUB_REPOSITORY" \
              --tag-sha "$TAG_SHA" \
              --live-revision "$live_revision"; then
              echo "live documentation revision ${live_revision} is at or past ${TAG_SHA}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "the live documentation revision did not reach ${TAG_SHA} within ${RETRY_WINDOW_SECONDS}s" >&2
              exit 1
            fi
            sleep "$RETRY_INTERVAL_SECONDS"
          done

  pypi-publish:
    # PyPI last (2026-09-28 review): a version number published over
    # a failed container or tarball job is burned for good — PyPI
    # never accepts the same version twice. Every build and smoke
    # job must pass first, so a failed tag run can be deleted and
    # retried without publishing the version.
    needs: [pypi-build, wheel-smoke, docs-live, build, container-publish]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish to PyPI with trusted publishing (production only)
        # Ticket 2049: the upload runs only in the production repository;
        # anywhere else (the release rehearsal) a token cannot mint and a
        # credential-free metadata check runs instead, so publish-release
        # still gates on this job.
        run: |
          if [ "$GITHUB_REPOSITORY" != "genomoncology/biomcp" ]; then
            echo "rehearsal: checking wheel metadata instead of uploading"
            uvx twine check dist/*
            exit 0
          fi
          uv publish --trusted-publishing always dist/*

  homebrew-tap:
    # The tap formula points at release tarballs, so the release
    # must be PUBLIC first: this job waits for publish-release
    # (ticket 1266; before, the formula landed on a draft release
    # and a failed publish broke `brew install`).
    needs: [build, docs-live, wheel-smoke, container-publish, pypi-publish, publish-release]
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TAG }}

      - name: Download checksums from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sha256" --dir dist

      - name: Update Homebrew tap (production only)
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          X86_SHA256="$(awk '{print $1}' dist/biomcp-darwin-x86_64.tar.gz.sha256)"
          ARM64_SHA256="$(awk '{print $1}' dist/biomcp-darwin-arm64.tar.gz.sha256)"
          test -n "$VERSION"
          test -n "$X86_SHA256"
          test -n "$ARM64_SHA256"
          # Ticket 2053: the rehearsal renders the formula the
          # production push would land, from the release checksums,
          # and checks both platform checksums before it exits.
          FORMULA_DIR="${RUNNER_TEMP:-$(mktemp -d)}"
          mkdir -p "${FORMULA_DIR}/Formula"
          python3 release/homebrew_formula.py --version "$VERSION" \
            --checksums dist --output "${FORMULA_DIR}/Formula/biomcp.rb"
          if [ "$GITHUB_REPOSITORY" != "genomoncology/biomcp" ]; then
            echo "rehearsal: formula ${VERSION} renders with both release checksums; not pushing"
            exit 0
          fi
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skip tap update."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/genomoncology/homebrew-biomcp.git" tap
          mkdir -p tap/Formula
          cp "${FORMULA_DIR}/Formula/biomcp.rb" tap/Formula/biomcp.rb
          cd tap
          git add Formula/biomcp.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap formula is already current."
            exit 0
          fi
          git commit -m "Update biomcp formula for ${TAG}"
          git push origin HEAD:main

  container-publish:
    needs: [build, docs-live, version-check, wheel-smoke, create-draft, publish-assets]
    if: >-
      !cancelled() && !inputs.candidate_sha && ((github.event_name == 'push' && success()) ||
      (inputs.container_only == true && needs.version-check.result == 'success' &&
      needs.docs-live.result == 'success' && needs.create-draft.result == 'skipped' &&
      needs.build.result == 'skipped' && needs['wheel-smoke'].result == 'skipped' &&
      needs.publish-assets.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      # The draft release is the artifact source: `gh release
      # download` on a still-draft release needs write-level
      # contents access, because GitHub lists drafts only to
      # callers with push access (fifth go-request review found
      # container-publish failing here under contents: read).
      contents: write
      packages: write
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the packaging ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.version-check.outputs.source_sha }}

      - name: Resolve the image version and source revision
        env:
          QUALIFIED_SHA: ${{ needs.version-check.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          SOURCE_SHA=""
          for attempt in 1 2 3 4 5; do
            SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)" && break
            sleep $(( attempt * 2 ))
          done
          test -n "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$QUALIFIED_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "VERSION=${VERSION}"
            echo "SOURCE_SHA=${SOURCE_SHA}"
            echo "CREATED=${CREATED}"
          } >> "$GITHUB_ENV"
          echo "Packaging from ${GITHUB_REF_NAME} (${GITHUB_SHA}); content from ${TAG} (${SOURCE_SHA})"

      - name: Stage the released Linux executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/container/amd64 dist/container/arm64
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'biomcp-linux-*' \
            --dir dist
          (cd dist && sha256sum -c biomcp-linux-x86_64.tar.gz.sha256 biomcp-linux-arm64.tar.gz.sha256)
          tar -xzf dist/biomcp-linux-x86_64.tar.gz -C dist/container/amd64 biomcp
          tar -xzf dist/biomcp-linux-arm64.tar.gz -C dist/container/arm64 biomcp
          (cd dist/container/amd64 && sha256sum biomcp > biomcp.sha256)
          (cd dist/container/arm64 && sha256sum biomcp > biomcp.sha256)
          ls -l dist/container/amd64 dist/container/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the versioned image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.VERSION }}
          build-args: |
            SOURCE_SHA=${{ env.SOURCE_SHA }}
            VERSION=${{ env.VERSION }}
            CREATED=${{ env.CREATED }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Smoke the linux/amd64 image from the registry
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker pull --platform linux/amd64 "$IMAGE"
          printed="$(docker run --rm --platform linux/amd64 "$IMAGE" --version)"
          printf '%s\n' "$printed"
          if [ "$(printf '%s' "$printed" | tr -d '\r\n')" != "biomcp ${VERSION}" ]; then
            echo "$IMAGE --version must print exactly 'biomcp ${VERSION}', got: $printed" >&2; exit 1
          fi
          UID_IN_CONTAINER="$(docker run --rm --platform linux/amd64 --entrypoint id "$IMAGE" -u)"
          if [ "$UID_IN_CONTAINER" = "0" ]; then
            echo "$IMAGE runs as root" >&2
            exit 1
          fi
          CONTAINER="$(docker create --platform linux/amd64 "$IMAGE")"
          REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CONTAINER")"
          docker rm "$CONTAINER" > /dev/null
          if [ "$REVISION" != "$SOURCE_SHA" ]; then
            echo "$IMAGE revision label $REVISION does not match $SOURCE_SHA" >&2
            exit 1
          fi
          echo "linux/amd64 $IMAGE runs as uid $UID_IN_CONTAINER with revision $REVISION"

      - name: Smoke the linux/arm64 image from the registry
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          docker pull --platform linux/arm64 "$IMAGE"
          printed="$(docker run --rm --platform linux/arm64 "$IMAGE" --version)"
          printf '%s\n' "$printed"
          if [ "$(printf '%s' "$printed" | tr -d '\r\n')" != "biomcp ${VERSION}" ]; then
            echo "$IMAGE --version must print exactly 'biomcp ${VERSION}', got: $printed" >&2; exit 1
          fi
          UID_IN_CONTAINER="$(docker run --rm --platform linux/arm64 --entrypoint id "$IMAGE" -u)"
          if [ "$UID_IN_CONTAINER" = "0" ]; then
            echo "$IMAGE runs as root" >&2
            exit 1
          fi
          CONTAINER="$(docker create --platform linux/arm64 "$IMAGE")"
          REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CONTAINER")"
          docker rm "$CONTAINER" > /dev/null
          if [ "$REVISION" != "$SOURCE_SHA" ]; then
            echo "$IMAGE revision label $REVISION does not match $SOURCE_SHA" >&2
            exit 1
          fi
          echo "linux/arm64 $IMAGE runs as uid $UID_IN_CONTAINER with revision $REVISION"

  publish-release:
    # No longer waits for homebrew-tap (ticket 1266): the tap now
    # waits for this job, so the release is public before the
    # formula's tarball URLs are installable.
    needs: [build, pypi-publish, container-publish, docs-live]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      # gh reads GH_REPO, not GITHUB_REPOSITORY; with no git
      # directory it cannot discover the repository (the fourth
      # go-request review reproduced create-draft failing here).
      GH_REPO: ${{ github.repository }}
    steps:
      # The repository must be present before any step runs a
      # repository script (2026-09-30 third go-request review: the
      # latest-decision script was missing on the runner and the step
      # logged "stays put" and passed).
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Docker work runs BEFORE the release goes public (2026-09-30
      # review): if any of it fails, the release is still a deletable
      # draft. The `latest` decision compares version numbers against
      # the PUBLISHED releases only — GitHub's "latest release" API
      # skips drafts, so asking it while this tag is still a draft
      # answers with the previous release and the move would silently
      # skip (second go-request review).
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest after both platform smokes pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          VERSION="${TAG#v}"
          # A failed query must fail the job, not read as "no
          # published releases" and move latest (third go-request
          # review).
          if ! gh release list --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts --json tagName --jq '.[].tagName' \
              > /tmp/published-tags.txt; then
            echo "gh release list failed; refusing to decide latest" >&2
            exit 1
          fi
          mapfile -t PUBLISHED < <(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' /tmp/published-tags.txt || true)
          set +e
          scripts/should-move-latest.sh "$TAG" "${PUBLISHED[@]}"
          decision=$?
          set -e
          case "$decision" in
            0)
              docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
              docker buildx imagetools inspect "${IMAGE}:latest"
              ;;
            3)
              echo "$TAG does not sort newest; latest stays put."
              ;;
            *)
              echo "should-move-latest.sh failed with exit $decision" >&2
              exit "$decision"
              ;;
          esac

      - name: Publish the GitHub release after every publisher succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false

  rehearsal-docs:
    needs: [version-check, qualification]
    if: inputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}
      - name: Validate the candidate documentation without deployment
        env:
          BIOMCP_DOCS_REVISION: ${{ inputs.candidate_sha }}
          NO_MKDOCS_2_WARNING: "1"
        run: |
          uv sync --extra dev --no-install-project --locked
          uv run --no-sync mkdocs build --strict
          test "$(cat site/__biomcp_revision__/latest.txt)" = "$BIOMCP_DOCS_REVISION"
          test "$(cat "site/__biomcp_revision__/${BIOMCP_DOCS_REVISION}.txt")" = "$BIOMCP_DOCS_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal-documentation
          path: site
          if-no-files-found: error

  rehearsal-container:
    needs: [version-check, build, wheel-smoke]
    if: inputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      SOURCE_SHA: ${{ inputs.candidate_sha }}
      IMAGE: biomcp-rehearsal:${{ matrix.arch }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: archive-*-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - name: Stage the checked Linux executables
        run: |
          (cd dist && sha256sum -c biomcp-linux-x86_64.tar.gz.sha256 biomcp-linux-arm64.tar.gz.sha256)
          mkdir -p dist/container/amd64 dist/container/arm64
          tar -xzf dist/biomcp-linux-x86_64.tar.gz -C dist/container/amd64 biomcp
          tar -xzf dist/biomcp-linux-arm64.tar.gz -C dist/container/arm64 biomcp
          (cd dist/container/amd64 && sha256sum biomcp > biomcp.sha256)
          (cd dist/container/arm64 && sha256sum biomcp > biomcp.sha256)
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build the production Dockerfile without a registry push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            SOURCE_SHA=${{ inputs.candidate_sha }}
            VERSION=${{ inputs.rehearsal_version }}
            CREATED=${{ env.CREATED }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
      - name: Smoke the local platform image and retain it
        run: |
          test "$(docker run --rm --platform "$PLATFORM" "$IMAGE" --version | tr -d '\r\n')" = "biomcp ${TAG#v}"
          test "$(docker run --rm --platform "$PLATFORM" --entrypoint id "$IMAGE" -u)" != 0
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$SOURCE_SHA"
          docker run --rm --platform "$PLATFORM" "$IMAGE" cache stats --json | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin), dict)'
          docker save "$IMAGE" -o rehearsal-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal-image-${{ matrix.arch }}
          path: rehearsal-image.tar
          if-no-files-found: error

  rehearsal-payloads:
    needs: [version-check, build, pypi-build]
    if: inputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}
      - name: Validate release publication payloads without credentials
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          uvx --from twine==6.2.0 twine check dist/*.whl
          python3 release/release_notes.py --changelog CHANGELOG.md --version "${TAG#v}" --output release-notes.md
          test -s release-notes.md
          python3 release/homebrew_formula.py --version "${TAG#v}" --checksums dist --output biomcp.rb
          ruby -c biomcp.rb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rehearsal-publication-payloads
          path: |
            release-notes.md
            biomcp.rb
          if-no-files-found: error

  rehearsal-complete:
    needs: [qualification, release-gate, build, pypi-build, wheel-smoke, rehearsal-docs, rehearsal-container, rehearsal-payloads]
    if: inputs.candidate_sha != ''
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Record the limits of a successful rehearsal
        run: |
          echo "All candidate builds, artifact smokes, documentation and publication payload checks passed."
          echo "Unexercised: GitHub release creation/upload/publication, registry authentication and pushes, PyPI trusted upload, Pages deployment/live-site verification, Homebrew push, and latest pointer movement." >> "$GITHUB_STEP_SUMMARY"
