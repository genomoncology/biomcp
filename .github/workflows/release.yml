name: Release candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA from main to stage privately
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.93.1
  PROTOC_VERSION: 28.3
  MANYLINUX_X86_64: quay.io/pypa/manylinux_2_28_x86_64@sha256:f854c50adf7b7a325bc4794316f3758d387a41d61f9e2ebca0f26c7dc8f761d4
  MANYLINUX_ARM64: quay.io/pypa/manylinux_2_28_aarch64@sha256:b9dd5b2d6885fae144119ac934978003bcc413087ea08f602a960257205ec246

jobs:
  candidate-gates:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Reject anything except one full main SHA
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3
        with:
          version: 0.8.0
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Canonical candidate gates
        run: |
          tools/bootstrap-lint-tools >> "$GITHUB_PATH"
          make lint
          make test
          make spec
      - name: Initialize candidate manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 release/candidate.py init \
            --sha "$SOURCE_SHA" --run-id "$RUN_ID" \
            --pins '{"rust":"1.93.1","protoc":"28.3","manylinux_x86_64":"sha256:f854c50adf7b7a325bc4794316f3758d387a41d61f9e2ebca0f26c7dc8f761d4"}' \
            --output candidate-manifest.json
          for gate in lint test spec; do
            python3 release/candidate.py record-gate --manifest candidate-manifest.json --name "$gate"
          done
          python3 release/candidate.py bind-signing-policy \
            --manifest candidate-manifest.json --policy release/signing-policy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-base-${{ github.run_id }}
          path: candidate-manifest.json
          if-no-files-found: error
          retention-days: 30

  linux-artifacts:
    needs: candidate-gates
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            container: quay.io/pypa/manylinux_2_28_x86_64@sha256:f854c50adf7b7a325bc4794316f3758d387a41d61f9e2ebca0f26c7dc8f761d4
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64@sha256:b9dd5b2d6885fae144119ac934978003bcc413087ea08f602a960257205ec246
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install pinned build tools
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Compile once, assemble, inspect, and smoke
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python3 release/build_target.py --target "$TARGET" --source-sha "$SOURCE_SHA" \
            --version "$VERSION" --run-id "$RUN_ID" --dist dist
          python3 release/smoke.py --bin "target/$TARGET/release/biomcp" \
            --version "$VERSION" --revision "${SOURCE_SHA:0:8}"
          tools/check-png-artifact "target/$TARGET/release/biomcp"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.slug }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  signed-artifacts:
    needs: candidate-gates
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            slug: macos-x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            slug: macos-arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
    runs-on: ${{ matrix.runner }}
    environment: biomcp-release-signing
    env:
      BIOMCP_SIGNING_POLICY_SHA256: ${{ secrets.BIOMCP_SIGNING_POLICY_SHA256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - name: Compile once, finalize, assemble, and inspect
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          TARGET: ${{ matrix.target }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python release/build_target.py --target "$TARGET" --source-sha "$SOURCE_SHA" \
            --version "$VERSION" --run-id "$RUN_ID" --dist dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.slug }}-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  container-artifact:
    needs: [linux-artifacts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'linux-*-${{ github.run_id }}'
          path: candidate
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Prepare exact staged Linux executables
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p dist/container/{amd64,arm64} dist/oci
          for tuple in 'linux-x86_64 amd64' 'linux-arm64 arm64'; do
            read -r platform architecture <<< "$tuple"
            record="candidate/$platform-$RUN_ID/native.json"
            archive="candidate/$platform-$RUN_ID/$(jq -r .filename "$record")"
            test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(jq -r .sha256 "$record")"
            tar -xzf "$archive" -C "dist/container/$architecture"
            binary_hash="$(sha256sum "dist/container/$architecture/biomcp" | cut -d' ' -f1)"
            test "$binary_hash" = "$(jq -r .evidence.binary_sha256 "$record")"
            printf '%s  biomcp\n' "$binary_hash" > "dist/container/$architecture/biomcp.sha256"
          done
          cp "candidate/linux-x86_64-$RUN_ID/sbom.cdx.json" dist/oci/sbom.cdx.json
      - name: Build and smoke both private platform images
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          CREATED="$(git show -s --format=%cI "$SOURCE_SHA")"
          for architecture in amd64 arm64; do
            docker buildx build --load --platform "linux/$architecture" \
              --build-arg SOURCE_SHA="$SOURCE_SHA" --build-arg VERSION="$VERSION" \
              --build-arg CREATED="$CREATED" --tag "biomcp-candidate:$architecture" .
            docker run --rm --platform "linux/$architecture" "biomcp-candidate:$architecture" --version
            test "$(docker run --rm --platform "linux/$architecture" --entrypoint id "biomcp-candidate:$architecture" -u)" != 0
            docker run --rm --platform "linux/$architecture" --entrypoint sh "biomcp-candidate:$architecture" \
              -c 'touch "$XDG_CACHE_HOME/biomcp/write-proof" && test -r "$XDG_CACHE_HOME/biomcp/write-proof"'
          done
      - name: Assemble and inspect private OCI index
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          CREATED="$(git show -s --format=%cI "$SOURCE_SHA")"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_SHA="$SOURCE_SHA" --build-arg VERSION="$VERSION" \
            --build-arg CREATED="$CREATED" --output type=oci,dest=dist/oci/biomcp.oci.tar .
          python3 release/container.py --layout dist/oci/biomcp.oci.tar \
            --record dist/oci/oci.json --source-sha "$SOURCE_SHA" --version "$VERSION" \
            --run-id "$RUN_ID" \
            --amd64-sha256 "$(jq -r .sha256 "candidate/linux-x86_64-$RUN_ID/native.json")" \
            --arm64-sha256 "$(jq -r .sha256 "candidate/linux-arm64-$RUN_ID/native.json")" \
            --sbom dist/oci/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-index-${{ github.run_id }}
          path: dist/oci/
          if-no-files-found: error
          retention-days: 30

  homebrew-formula:
    needs: signed-artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 'macos-*-${{ github.run_id }}'
          path: candidate
      - name: Render exact immutable formula
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p dist/homebrew/Formula
          python3 release/homebrew.py \
            --arm-record "candidate/macos-arm64-$RUN_ID/native.json" \
            --intel-record "candidate/macos-x86_64-$RUN_ID/native.json" \
            --output dist/homebrew/Formula/biomcp.rb --record dist/homebrew/homebrew.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebrew-formula-${{ github.run_id }}
          path: dist/homebrew/
          if-no-files-found: error
          retention-days: 30

  homebrew-smoke:
    needs: [signed-artifacts, homebrew-formula]
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            slug: macos-x86_64
          - runner: macos-15
            slug: macos-arm64
    runs-on: ${{ matrix.runner }}
    environment: biomcp-release-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.slug }}-${{ github.run_id }}
          path: candidate/native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: homebrew-formula-${{ github.run_id }}
          path: candidate/homebrew
      - name: Preseed exact final-URL cache and install without download
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_FROM_API: 1
          HOMEBREW_CACHE: ${{ runner.temp }}/homebrew-cache
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          record=candidate/native/native.json
          archive="candidate/native/$(jq -r .filename "$record")"
          url="https://github.com/genomoncology/biomcp/releases/download/v$VERSION/$(basename "$archive")"
          cache_path="$(URL="$url" python3 -c 'import hashlib,os; u=os.environ["URL"]; print(os.path.join(os.environ["HOMEBREW_CACHE"], "downloads", hashlib.sha256(u.encode()).hexdigest()+"--"+os.path.basename(u)))')"
          mkdir -p "$(dirname "$cache_path")"
          cp "$archive" "$cache_path"
          brew install --formula candidate/homebrew/Formula/biomcp.rb
          test "$(shasum -a 256 "$(brew --prefix)/bin/biomcp" | cut -d' ' -f1)" = "$(jq -r .evidence.binary_sha256 "$record")"
          python3 release/smoke.py --bin "$(brew --prefix)/bin/biomcp" \
            --version "$VERSION" --revision "${SOURCE_SHA:0:8}"
          tools/check-png-artifact "$(brew --prefix)/bin/biomcp"
          xattr -w com.apple.quarantine '0081;candidate;BioMCP;' "$archive"
          spctl --assess --type execute --verbose=4 "$(brew --prefix)/bin/biomcp"
      - name: Record architecture proof
        run: |
          mkdir -p proof
          printf '{"runner":"%s","formula_sha256":"%s","passed":true}\n' \
            '${{ matrix.runner }}' \
            "$(shasum -a 256 candidate/homebrew/Formula/biomcp.rb | cut -d' ' -f1)" \
            > proof/${{ matrix.slug }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homebrew-proof-${{ matrix.slug }}-${{ github.run_id }}
          path: proof/
          if-no-files-found: error
          retention-days: 30

  seal-candidate:
    needs: [candidate-gates, linux-artifacts, signed-artifacts, container-artifact, homebrew-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-${{ github.run_id }}'
          path: candidate
      - name: Register all five platform pairs and seal private candidate
        run: |
          cp candidate/candidate-base-${{ github.run_id }}/candidate-manifest.json .
          for platform in linux-x86_64 linux-arm64 macos-x86_64 macos-arm64 windows-x86_64; do
            for kind in native wheel; do
              record="candidate/$platform-${{ github.run_id }}/$kind.json"
              artifact="candidate/$platform-${{ github.run_id }}/$(python3 -c "import json; print(json.load(open('$record'))['filename'])")"
              python3 release/candidate.py register --manifest candidate-manifest.json --record "$record" --artifact "$artifact"
            done
          done
          python3 release/candidate.py register --manifest candidate-manifest.json \
            --record "candidate/oci-index-${{ github.run_id }}/oci.json" \
            --artifact "candidate/oci-index-${{ github.run_id }}/biomcp.oci.tar"
          python3 release/candidate.py register --manifest candidate-manifest.json \
            --record "candidate/homebrew-formula-${{ github.run_id }}/homebrew.json" \
            --artifact "candidate/homebrew-formula-${{ github.run_id }}/Formula/biomcp.rb"
          python3 release/candidate.py finalize --manifest candidate-manifest.json --set delivery
          python3 release/candidate.py checksum --manifest candidate-manifest.json > candidate-manifest.json.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sealed-candidate-${{ github.run_id }}
          path: |
            candidate-manifest.json
            candidate-manifest.json.sha256
          if-no-files-found: error
          retention-days: 30
