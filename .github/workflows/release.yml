name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to upload assets to (e.g. v0.9.0)
        required: true
        type: string
      container_only:
        description: Build and push only the container image for an already-published release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: 0.8.0

jobs:
  version-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Require the tag and committed versions to agree
        run: python3 scripts/check-release-versions.py --tag "$TAG"

      - name: Require the changelog to cover merged tickets
        run: python3 scripts/check-changelog-coverage.py --tag "$TAG"

  create-draft:
    needs: [version-check]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG"

  build:
    needs: [version-check, create-draft]
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: biomcp-linux-x86_64.tar.gz
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: biomcp-linux-arm64.tar.gz
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: biomcp-darwin-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: biomcp-darwin-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: biomcp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: runner.os != 'Linux'
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        if: runner.os != 'Linux'
        continue-on-error: true
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        if: runner.os != 'Linux'
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      # Linux tarballs build inside the same manylinux_2_28 container
      # as the wheels, so both artifact families carry one documented
      # glibc floor. The floor scan runs over the pre-tar binary: the
      # same bytes the archive ships. rustup is pinned by version and
      # checksum; nothing pipes a remote script into a shell.
      - name: Build and package inside the manylinux 2_28 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io "${{ matrix.container }}" bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init.sha256
            sha256sum -c rustup-init.sha256
            chmod +x rustup-init
            ./rustup-init -y --default-toolchain 1.93.1 --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked --target ${{ matrix.target }}
            /opt/python/cp312-cp312/bin/python scripts/check-wheel-glibc-floor.py --elf target/${{ matrix.target }}/release/biomcp 2.28
            cd target/${{ matrix.target }}/release
            tar czf ../../../${{ matrix.artifact }} biomcp
            cd ../../..
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          '

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} biomcp
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          else
            shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }} biomcp.exe
          cd ../../..
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
        shell: bash

      - name: Upload release assets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "${{ matrix.artifact }}" \
            "${{ matrix.artifact }}.sha256" \
            --clobber

  pypi-build:
    needs: [version-check]
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: runner.os != 'Linux'
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        if: runner.os != 'Linux'
        continue-on-error: true
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned maturin
        if: runner.os != 'Linux'
        run: python -m pip install maturin==1.9.6

      - name: Build wheels
        if: runner.os != 'Linux'
        run: maturin build --release --locked --target ${{ matrix.target }}

      # Linux wheels build inside the manylinux_2_28 container so the
      # glibc 2.28 floor is true by construction, not merely tagged;
      # the platform tag is pinned with maturin and the scan step
      # enforces the floor against the artifact that ships. rustup is
      # pinned by version and checksum; nothing pipes a remote script
      # into a shell.
      - name: Build wheels inside the manylinux 2_28 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io "${{ matrix.container }}" bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init
            curl --proto "=https" --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.target }}/rustup-init.sha256
            sha256sum -c rustup-init.sha256
            chmod +x rustup-init
            ./rustup-init -y --default-toolchain 1.93.1 --profile minimal
            . "$HOME/.cargo/env"
            /opt/python/cp312-cp312/bin/python -m pip install maturin==1.9.6
            /opt/python/cp312-cp312/bin/python -m maturin build --release --locked --target ${{ matrix.target }} --compatibility manylinux_2_28 -o target/wheels
            case "${{ matrix.target }}" in
              x86_64-unknown-linux-gnu) tag=manylinux_2_28_x86_64 ;;
              aarch64-unknown-linux-gnu) tag=manylinux_2_28_aarch64 ;;
              *) echo "unexpected Linux target: ${{ matrix.target }}" >&2; exit 1 ;;
            esac
            for wheel in target/wheels/*.whl; do
              case "$wheel" in
                *"$tag".whl) ;;
                *) echo "wheel must end in $tag.whl: $wheel" >&2; exit 1 ;;
              esac
            done
            /opt/python/cp312-cp312/bin/python scripts/check-wheel-glibc-floor.py target/wheels/*.whl 2.28
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  wheel-smoke:
    needs: [pypi-build]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: wheel-x86_64-unknown-linux-gnu
            executable: bin/biomcp
            python: bin/python
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            artifact: wheel-aarch64-unknown-linux-gnu
            executable: bin/biomcp
            python: bin/python
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-14
            artifact: wheel-aarch64-apple-darwin
            executable: bin/biomcp
            python: bin/python
          - os: macos-latest
            artifact: wheel-x86_64-apple-darwin
            executable: bin/biomcp
            python: bin/python
          - os: windows-latest
            artifact: wheel-x86_64-pc-windows-msvc
            executable: Scripts/biomcp.exe
            python: Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/wheel

      - name: Install the wheel into a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/${{ matrix.python }}" -m pip install "$RUNNER_TEMP"/wheel/*.whl
          "$RUNNER_TEMP/wheel-venv/${{ matrix.executable }}" --version

      # Prove the glibc floor at runtime: install and run the wheel
      # inside the same manylinux_2_28 environment users on RHEL 8 or
      # Debian 10 have.
      - name: Run the wheel inside the manylinux 2_28 container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$RUNNER_TEMP/wheel:/wheel:ro" "${{ matrix.container }}" bash -euo pipefail -c '
            /opt/python/cp312-cp312/bin/python -m pip install --no-cache-dir /wheel/*.whl
            /opt/python/cp312-cp312/bin/biomcp --version
            stats="$(/opt/python/cp312-cp312/bin/biomcp cache stats --json)"
            case "$stats" in
              "{"*) ;;
              *) echo "cache stats must print a JSON object, got: $stats" >&2; exit 1 ;;
            esac
          '

      - name: Smoke the installed wheel on every shipped platform
        shell: bash
        run: |
          BIOMCP="$RUNNER_TEMP/wheel-venv/${{ matrix.executable }}"

          require_exit() {
            expected="$1"; shift
            status=0
            output="$("$BIOMCP" "$@" 2>&1)" || status=$?
            printf '%s\n' "$output" | head -n 20
            if [ "$status" -eq 101 ] || [ "$status" -ge 128 ]; then
              echo "panic or crash (exit $status) from: biomcp $*" >&2
              return 1
            fi
            if printf '%s\n' "$output" | grep -q "has overflowed its stack"; then
              echo "stack overflow from: biomcp $*" >&2
              return 1
            fi
            if [ "$status" -ne "$expected" ]; then
              echo "expected exit $expected, got $status from: biomcp $*" >&2
              return 1
            fi
          }

          require_json() {
            status=0
            output="$("$BIOMCP" "$@" 2>/dev/null)" || status=$?
            if [ "$status" -ne 0 ]; then
              echo "json mode must exit 0 from: biomcp $* (exit $status)" >&2
              return 1
            fi
            case "$output" in
              "{"*) ;;
              *) echo "json mode must print an object from: biomcp $*" >&2; return 1 ;;
            esac
            if printf '%s\n' "$output" | grep -q "skill asset"; then
              echo "skill asset error from: biomcp $*" >&2
              return 1
            fi
          }

          require_exit 0 search trial --condition diabetes --limit 1
          require_exit 0 search trial --criteria "anti-PD-1 therapy" --limit 3
          require_exit 0 drug interactions apixaban
          require_exit 0 drug trials imatinib

          status=0
          output="$("$BIOMCP" drug adverse-events qwertyzzznonexistent999 2>&1)" || status=$?
          printf '%s\n' "$output" | head -n 20
          [ "$status" -eq 0 ]
          printf '%s\n' "$output" | grep -q "Drug not found in FAERS"

          require_json get drug --region us aspirin regulatory -j
          require_json search trial --condition diabetes --limit 1 -j

  docs-live:
    needs: [version-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      LIVE_REVISION_URL: https://biomcp.org/__biomcp_revision__/latest.txt
      RETRY_WINDOW_SECONDS: "600"
      RETRY_INTERVAL_SECONDS: "30"
    steps:
      - name: Check out the gate helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve the tag commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_SHA=""
          for attempt in 1 2 3 4 5; do
            TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)" && break
            sleep $(( attempt * 2 ))
          done
          test -n "$TAG_SHA"
          echo "TAG_SHA=${TAG_SHA}" >> "$GITHUB_ENV"
          echo "release tag ${TAG} resolves to ${TAG_SHA}"

      - name: Require the live documentation revision to equal or descend from the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + RETRY_WINDOW_SECONDS ))
          attempt=0
          while true; do
            attempt=$(( attempt + 1 ))
            live_revision="$(
              curl --fail --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --header 'Cache-Control: no-cache' \
                --header 'Pragma: no-cache' \
                --header 'User-Agent: BioMCP-docs-live-gate/1' \
                "${LIVE_REVISION_URL}?biomcp_verify=$(date +%s%N)-${attempt}"
            )" || live_revision=""
            if [[ ! "$live_revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "attempt ${attempt}: ${LIVE_REVISION_URL} did not serve a 40-character revision"
            elif python3 scripts/check-docs-live-revision.py \
              --repository "$GITHUB_REPOSITORY" \
              --tag-sha "$TAG_SHA" \
              --live-revision "$live_revision"; then
              echo "live documentation revision ${live_revision} is at or past ${TAG_SHA}"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "the live documentation revision did not reach ${TAG_SHA} within ${RETRY_WINDOW_SECONDS}s" >&2
              exit 1
            fi
            sleep "$RETRY_INTERVAL_SECONDS"
          done

  pypi-publish:
    needs: [pypi-build, wheel-smoke, docs-live]
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: ${{ env.UV_VERSION }}

      - name: Publish to PyPI with trusted publishing
        run: uv publish --trusted-publishing always dist/*

  homebrew-tap:
    needs: [build, docs-live, wheel-smoke]
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TAG }}

      - name: Download checksums from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sha256" --dir dist

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skip tap update."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/genomoncology/homebrew-biomcp.git" tap
          mkdir -p tap/Formula
          VERSION="${TAG#v}"
          X86_SHA256="$(awk '{print $1}' dist/biomcp-darwin-x86_64.tar.gz.sha256)"
          ARM64_SHA256="$(awk '{print $1}' dist/biomcp-darwin-arm64.tar.gz.sha256)"
          cat > tap/Formula/biomcp.rb << FORMULA
          class Biomcp < Formula
            desc "Biomedical MCP CLI and knowledge server"
            homepage "https://biomcp.org"
            version "${VERSION}"
            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/genomoncology/biomcp/releases/download/v${VERSION}/biomcp-darwin-x86_64.tar.gz"
                sha256 "${X86_SHA256}"
              else
                url "https://github.com/genomoncology/biomcp/releases/download/v${VERSION}/biomcp-darwin-arm64.tar.gz"
                sha256 "${ARM64_SHA256}"
              end
            end
            def install
              bin.install "biomcp"
            end
          end
          FORMULA
          cd tap
          git add Formula/biomcp.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap formula is already current."
            exit 0
          fi
          git commit -m "Update biomcp formula for ${TAG}"
          git push origin HEAD:main

  container-publish:
    needs: [build, docs-live, version-check, wheel-smoke, create-draft]
    if: >-
      !cancelled() && ((github.event_name == 'push' && success()) ||
      (inputs.container_only == true && needs.version-check.result == 'success' &&
      needs.docs-live.result == 'success' && needs.create-draft.result == 'skipped' &&
      needs.build.result == 'skipped' && needs['wheel-smoke'].result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the packaging ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve the image version and source revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          SOURCE_SHA=""
          for attempt in 1 2 3 4 5; do
            SOURCE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha 2>/dev/null)" && break
            sleep $(( attempt * 2 ))
          done
          test -n "$SOURCE_SHA"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "VERSION=${VERSION}"
            echo "SOURCE_SHA=${SOURCE_SHA}"
            echo "CREATED=${CREATED}"
          } >> "$GITHUB_ENV"
          echo "Packaging from ${GITHUB_REF_NAME} (${GITHUB_SHA}); content from ${TAG} (${SOURCE_SHA})"

      - name: Stage the released Linux executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/container/amd64 dist/container/arm64
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'biomcp-linux-*' \
            --dir dist
          (cd dist && sha256sum -c biomcp-linux-x86_64.tar.gz.sha256 biomcp-linux-arm64.tar.gz.sha256)
          tar -xzf dist/biomcp-linux-x86_64.tar.gz -C dist/container/amd64 biomcp
          tar -xzf dist/biomcp-linux-arm64.tar.gz -C dist/container/arm64 biomcp
          (cd dist/container/amd64 && sha256sum biomcp > biomcp.sha256)
          (cd dist/container/arm64 && sha256sum biomcp > biomcp.sha256)
          ls -l dist/container/amd64 dist/container/arm64

      - name: Set up QEMU
        uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the versioned image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/genomoncology/biomcp:${{ env.VERSION }}
          build-args: |
            SOURCE_SHA=${{ env.SOURCE_SHA }}
            VERSION=${{ env.VERSION }}
            CREATED=${{ env.CREATED }}

      - name: Smoke the linux/amd64 image from the registry
        run: |
          IMAGE="ghcr.io/genomoncology/biomcp:${VERSION}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 "$IMAGE" --version
          UID_IN_CONTAINER="$(docker run --rm --platform linux/amd64 --entrypoint id "$IMAGE" -u)"
          if [ "$UID_IN_CONTAINER" = "0" ]; then
            echo "$IMAGE runs as root" >&2
            exit 1
          fi
          CONTAINER="$(docker create --platform linux/amd64 "$IMAGE")"
          REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CONTAINER")"
          docker rm "$CONTAINER" > /dev/null
          if [ "$REVISION" != "$SOURCE_SHA" ]; then
            echo "$IMAGE revision label $REVISION does not match $SOURCE_SHA" >&2
            exit 1
          fi
          echo "linux/amd64 $IMAGE runs as uid $UID_IN_CONTAINER with revision $REVISION"

      - name: Smoke the linux/arm64 image from the registry
        run: |
          IMAGE="ghcr.io/genomoncology/biomcp:${VERSION}"
          docker pull --platform linux/arm64 "$IMAGE"
          docker run --rm --platform linux/arm64 "$IMAGE" --version
          UID_IN_CONTAINER="$(docker run --rm --platform linux/arm64 --entrypoint id "$IMAGE" -u)"
          if [ "$UID_IN_CONTAINER" = "0" ]; then
            echo "$IMAGE runs as root" >&2
            exit 1
          fi
          CONTAINER="$(docker create --platform linux/arm64 "$IMAGE")"
          REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CONTAINER")"
          docker rm "$CONTAINER" > /dev/null
          if [ "$REVISION" != "$SOURCE_SHA" ]; then
            echo "$IMAGE revision label $REVISION does not match $SOURCE_SHA" >&2
            exit 1
          fi
          echo "linux/arm64 $IMAGE runs as uid $UID_IN_CONTAINER with revision $REVISION"

  publish-release:
    needs: [build, pypi-publish, homebrew-tap, container-publish, docs-live]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Publish the GitHub release after every publisher succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest after both platform smokes pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/genomoncology/biomcp"
          VERSION="${TAG#v}"
          LATEST_RELEASE="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$LATEST_RELEASE" != "$TAG" ]; then
            echo "$TAG is not the latest release ($LATEST_RELEASE); skip the latest tag."
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}:latest"
