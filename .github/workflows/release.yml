name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to upload assets to (e.g. v0.9.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: biomcp-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: biomcp-linux-arm64.tar.gz
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: biomcp-darwin-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: biomcp-darwin-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: biomcp-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        continue-on-error: true
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV

      - name: Build release binary
        run: |
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} biomcp
          cd ../../..
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact }} biomcp.exe
          cd ../../..
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
        shell: bash

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: application/octet-stream

      - name: Upload checksum
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ matrix.artifact }}.sha256
          asset_name: ${{ matrix.artifact }}.sha256
          asset_content_type: text/plain

  pypi-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        continue-on-error: true
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v4

      - name: Build wheel
        run: uv build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  pypi-publish:
    needs: [pypi-build]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  homebrew-tap:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: biomcp-*
          path: dist
          merge-multiple: true

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not configured; skip tap update."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/genomoncology/homebrew-biomcp.git" tap
          mkdir -p tap/Formula
          VERSION="${GITHUB_REF_NAME#v}"
          X86_SHA256="$(awk '{print $1}' dist/biomcp-darwin-x86_64.tar.gz.sha256)"
          ARM64_SHA256="$(awk '{print $1}' dist/biomcp-darwin-arm64.tar.gz.sha256)"
          cat > tap/Formula/biomcp.rb << FORMULA
          class Biomcp < Formula
            desc "Biomedical MCP CLI and knowledge server"
            homepage "https://biomcp.org"
            version "${VERSION}"
            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/genomoncology/biomcp/releases/download/v${VERSION}/biomcp-darwin-x86_64.tar.gz"
                sha256 "${X86_SHA256}"
              else
                url "https://github.com/genomoncology/biomcp/releases/download/v${VERSION}/biomcp-darwin-arm64.tar.gz"
                sha256 "${ARM64_SHA256}"
              end
            end
            def install
              bin.install "biomcp"
            end
          end
          FORMULA
          cd tap
          git add Formula/biomcp.rb
          if git diff --cached --quiet; then
            echo "Homebrew tap formula is already current."
            exit 0
          fi
          git commit -m "Update biomcp formula for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
