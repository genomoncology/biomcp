name: BioData 1.0 focused verification

on:
  push:
    branches: [biodata/biomcp-1.0]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.93.1
  PYTHON_VERSION: 3.12.3
  UV_VERSION: 0.8.0
  BUBBLEWRAP_VERSION: 0.9.0-1ubuntu0.1
  APPARMOR_VERSION: 4.0.1really4.0.1-0ubuntu0.24.04.7

jobs:
  focused-biodata-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.12.3
      - name: Install pinned uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: 0.8.0
      - name: Install the offline sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            "bubblewrap=$BUBBLEWRAP_VERSION" \
            "apparmor=$APPARMOR_VERSION" \
            "apparmor-profiles=$APPARMOR_VERSION"
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          tools/run-offline -- true
      - name: Prepare the Python development environment
        run: uv sync --extra dev --locked
      - name: Build BioMCP without default features
        run: cargo build --locked --no-default-features --bin biomcp
      - name: Run focused BioData verification
        env:
          BIOMCP_BIN: ${{ github.workspace }}/target/debug/biomcp
        run: tools/check-biodata-1.0
