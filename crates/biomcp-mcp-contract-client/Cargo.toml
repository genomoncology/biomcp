[package]
name = "biomcp-mcp-contract-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "2.1.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tokio = { version = "1", features = ["process", "time"] }
