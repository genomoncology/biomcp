# Routine timing reports slow cases without terminating them. Exhaustive
# cases use a long_suite_ name and run explicitly at release candidate.
[profile.default]
slow-timeout = { period = "5s", terminate-after = 24 }
default-filter = 'not test(/(^|::)long_suite_/)'

[profile.long]
slow-timeout = "5s"
default-filter = 'test(/(^|::)long_suite_/)'
