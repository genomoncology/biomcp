[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "biomcp-cli"
version = "0.9.4"
description = "Biomedical MCP CLI: install biomcp-cli from PyPI, not unrelated biomcp; provides the biomcp binary."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["bioinformatics", "mcp", "genomics", "clinical-trials", "pubmed"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://biomcp.org"
Repository = "https://github.com/genomoncology/biomcp"
Documentation = "https://biomcp.org"

[project.optional-dependencies]
dev = [
  "jsonschema>=4.26",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "pytest-xdist",
  "tiktoken>=0.12,<0.13",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "pymdown-extensions>=10.0",
]

[tool.ruff]
extend-exclude = [
  "architecture/experiments/**",
]

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus the banned sleep API (2076): a
# new time.sleep in a test fails the gate; tests wait on signals.
select = ["E4", "E7", "E9", "F", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "tests wait on signals, not clocks"

[tool.ruff.lint.per-file-ignores]
# 2076: these files sleep today; 2081 removes the sleeps and these lines.
"tests/support.py" = ["TID251"]
"tests/test_author_surface_docs.py" = ["TID251"]
"tests/test_disease_survival_fixture_lifecycle.py" = ["TID251"]
"tests/test_mcp_2026_protocol.py" = ["TID251"]
"tests/test_mcp_http_surface.py" = ["TID251"]
"tests/test_mychem_empty_spec_fixture_contract.py" = ["TID251"]
"tests/test_release_smoke_script.py" = ["TID251"]
"spec/fixtures/fixture-supervisor.py" = ["TID251"]
# Not a test: the docs-publication verifier takes its clock by injection,
# and time.sleep is only its default argument.
"scripts/verify-docs-publication.py" = ["TID251"]

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
slow_test_warning_seconds = 30
# Retain through every failure phase; conftest removes passing replay directories.
tmp_path_retention_policy = "all"
