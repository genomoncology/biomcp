<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="888" viewBox="0 0 1600 888" role="img" aria-labelledby="relationship-title relationship-description">
<title id="relationship-title">ScientificPublication direct relationships</title>
<desc id="relationship-description">Six direct relationships from ScientificPublication fields to component models, in adopted catalog order. Equivalent text follows the image.</desc>
<rect x="24" y="30" width="250" height="56" rx="8" fill="#eef5ff" stroke="#315c8c"/>
<text x="149" y="64" text-anchor="middle" font-family="sans-serif" font-size="20">ScientificPublication</text>
<line x1="274" y1="58" x2="340" y2="59" stroke="#52687a" stroke-width="2"/>
<g data-relationship-id="publication-identifiers" data-source="model:ScientificPublication/field:identifiers" data-target="model:PublicationIdentifier" data-kind="contains">
<rect x="340" y="28" width="1236" height="116" rx="8" fill="#ffffff" stroke="#52687a"/>
<text x="360" y="49" font-family="sans-serif" font-size="17" font-weight="bold" data-role="id">publication-identifiers</text>
<text x="360" y="71" font-family="sans-serif" font-size="14" data-role="source">model:ScientificPublication/field:identifiers</text>
<text x="360" y="93" font-family="sans-serif" font-size="14" data-role="target">model:PublicationIdentifier</text>
<text x="360" y="115" font-family="sans-serif" font-size="14" data-role="kind">contains</text>
<text x="360" y="137" font-family="sans-serif" font-size="14" data-role="explanation">The publication retains one to three authority-qualified identifiers in canonical order.</text>
</g>
<line x1="274" y1="58" x2="340" y2="195" stroke="#52687a" stroke-width="2"/>
<g data-relationship-id="publication-title" data-source="model:ScientificPublication/field:title" data-target="model:PublicationTitle" data-kind="contains">
<rect x="340" y="164" width="1236" height="116" rx="8" fill="#ffffff" stroke="#52687a"/>
<text x="360" y="185" font-family="sans-serif" font-size="17" font-weight="bold" data-role="id">publication-title</text>
<text x="360" y="207" font-family="sans-serif" font-size="14" data-role="source">model:ScientificPublication/field:title</text>
<text x="360" y="229" font-family="sans-serif" font-size="14" data-role="target">model:PublicationTitle</text>
<text x="360" y="251" font-family="sans-serif" font-size="14" data-role="kind">contains</text>
<text x="360" y="273" font-family="sans-serif" font-size="14" data-role="explanation">The publication preserves the source-observed title state without inventing text.</text>
</g>
<line x1="274" y1="58" x2="340" y2="331" stroke="#52687a" stroke-width="2"/>
<g data-relationship-id="publication-abstract" data-source="model:ScientificPublication/field:abstract_text" data-target="model:PublicationAbstract" data-kind="contains">
<rect x="340" y="300" width="1236" height="116" rx="8" fill="#ffffff" stroke="#52687a"/>
<text x="360" y="321" font-family="sans-serif" font-size="17" font-weight="bold" data-role="id">publication-abstract</text>
<text x="360" y="343" font-family="sans-serif" font-size="14" data-role="source">model:ScientificPublication/field:abstract_text</text>
<text x="360" y="365" font-family="sans-serif" font-size="14" data-role="target">model:PublicationAbstract</text>
<text x="360" y="387" font-family="sans-serif" font-size="14" data-role="kind">contains</text>
<text x="360" y="409" font-family="sans-serif" font-size="14" data-role="explanation">The publication preserves the source-observed abstract state without inventing text.</text>
</g>
<line x1="274" y1="58" x2="340" y2="467" stroke="#52687a" stroke-width="2"/>
<g data-relationship-id="publication-journals" data-source="model:ScientificPublication/field:journals" data-target="model:JournalAssertion" data-kind="contains">
<rect x="340" y="436" width="1236" height="116" rx="8" fill="#ffffff" stroke="#52687a"/>
<text x="360" y="457" font-family="sans-serif" font-size="17" font-weight="bold" data-role="id">publication-journals</text>
<text x="360" y="479" font-family="sans-serif" font-size="14" data-role="source">model:ScientificPublication/field:journals</text>
<text x="360" y="501" font-family="sans-serif" font-size="14" data-role="target">model:JournalAssertion</text>
<text x="360" y="523" font-family="sans-serif" font-size="14" data-role="kind">contains</text>
<text x="360" y="545" font-family="sans-serif" font-size="14" data-role="explanation">Opaque journal assertions retain source order.</text>
</g>
<line x1="274" y1="58" x2="340" y2="603" stroke="#52687a" stroke-width="2"/>
<g data-relationship-id="publication-authorships" data-source="model:ScientificPublication/field:authorships" data-target="model:AuthorshipAssertion" data-kind="contains">
<rect x="340" y="572" width="1236" height="116" rx="8" fill="#ffffff" stroke="#52687a"/>
<text x="360" y="593" font-family="sans-serif" font-size="17" font-weight="bold" data-role="id">publication-authorships</text>
<text x="360" y="615" font-family="sans-serif" font-size="14" data-role="source">model:ScientificPublication/field:authorships</text>
<text x="360" y="637" font-family="sans-serif" font-size="14" data-role="target">model:AuthorshipAssertion</text>
<text x="360" y="659" font-family="sans-serif" font-size="14" data-role="kind">contains</text>
<text x="360" y="681" font-family="sans-serif" font-size="14" data-role="explanation">Opaque authorship assertions retain source order and unknown completeness.</text>
</g>
<line x1="274" y1="58" x2="340" y2="739" stroke="#52687a" stroke-width="2"/>
<g data-relationship-id="publication-named-dates" data-source="model:ScientificPublication/field:named_dates" data-target="model:NamedDateAssertion" data-kind="contains">
<rect x="340" y="708" width="1236" height="116" rx="8" fill="#ffffff" stroke="#52687a"/>
<text x="360" y="729" font-family="sans-serif" font-size="17" font-weight="bold" data-role="id">publication-named-dates</text>
<text x="360" y="751" font-family="sans-serif" font-size="14" data-role="source">model:ScientificPublication/field:named_dates</text>
<text x="360" y="773" font-family="sans-serif" font-size="14" data-role="target">model:NamedDateAssertion</text>
<text x="360" y="795" font-family="sans-serif" font-size="14" data-role="kind">contains</text>
<text x="360" y="817" font-family="sans-serif" font-size="14" data-role="explanation">Opaque named-date assertions retain source order.</text>
</g>
</svg>
